<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MetroGuide — Find. Route. Travel.</title>
<style>
  :root{
    --text:#111827;
    --muted:#667085;
    --line:#e7e9ee;
    --soft:#f7f8fa;
    --accent:#1f5eff;
    --accent-soft:#eef3ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#fff;
    color:var(--text);
  }
  html, body{width:100%; min-height:100%; margin:0;}
  body{
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  .page{
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    height:72px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
  }
  .header-inner{
    width:calc(100% - 48px);
    max-width:none;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--text);
  }
  .brand-mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--text);
    display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:15px;
  }
  .brand-name{font-size:20px;font-weight:750;letter-spacing:-.4px}
  .site-logo{display:block;width:270px;height:auto;max-height:64px;object-fit:contain;object-position:left center}
  .header-right{
    font-size:13px;color:var(--muted);
  }
  main{
    width:calc(100% - 48px);
    max-width:none;
    margin:0 auto;
    padding:8px 0 72px;
  }
  .intro{text-align:center;max-width:720px;margin:0 auto 44px}
  .eyebrow{
    font-size:12px;font-weight:750;letter-spacing:.11em;
    text-transform:uppercase;color:var(--accent);
    margin-bottom:12px;
  }
  h1{
    margin:0;
    font-size:clamp(34px,5vw,52px);
    line-height:1.08;
    letter-spacing:-1.8px;
  }
  .tagline{
    margin:12px 0 0;
    color:var(--muted);
    font-size:17px;
  }
  .search{
    width:min(620px,100%);
    margin:28px auto 0;
    position:relative;
  }
  .search input{
    width:100%;
    height:52px;
    border:1px solid #d9dde5;
    border-radius:12px;
    padding:0 18px 0 48px;
    font-size:15px;
    outline:none;
    background:#fff;
  }
  .search input:focus{
    border-color:#9db6ff;
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .search-icon{
    position:absolute;left:18px;top:50%;
    transform:translateY(-50%);
    color:#7a8495;font-size:18px;
  }
  .section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .section-head h2{
    margin:0;font-size:21px;letter-spacing:-.4px;
  }
  .section-head span{font-size:13px;color:var(--muted)}
  .cities{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .city{
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:18px;
    text-align:left;
    cursor:pointer;
    transition:.16s ease;
  }
  .city:hover{
    border-color:#c4cad5;
    transform:translateY(-1px);
    box-shadow:0 5px 18px rgba(16,24,40,.06);
  }
  .all-cities-button{
    cursor:pointer;
  }
  .all-cities-button.active{
    border-color:#b9c8ee;
    background:#f8faff;
  }
  .city-top{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
  }
  .city-name{font-size:16px;font-weight:700}
  .arrow{color:#98a2b3;font-size:18px}
  .city-meta{
    margin-top:7px;color:var(--muted);font-size:13px;
  }
  .all{
    margin-top:48px;
    padding-top:30px;
    border-top:1px solid var(--line);
  }
  .city-list{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    column-gap:32px;
    row-gap:0;
  }
  .city-link{
    padding:13px 0;
    border-bottom:1px solid #f0f1f4;
    color:#344054;
    text-decoration:none;
    font-size:14px;
  }
  .city-link:hover{color:var(--accent)}
  footer{
    border-top:1px solid var(--line);
    color:#98a2b3;
    font-size:12px;
    padding:22px 20px;
    text-align:center;
  }
  @media(max-width:760px){
    header{height:64px}
    .header-inner{width:calc(100% - 24px)}
    .brand-name{font-size:18px}
    .site-logo{width:180px;max-height:48px}
    main{width:calc(100% - 24px);padding:8px 0 52px}
    .intro{margin-bottom:34px}
    .cities{grid-template-columns:1fr 1fr}
    .city-list{grid-template-columns:1fr 1fr}
    .header-right{display:none}
  }
  @media(max-width:480px){
    .cities{grid-template-columns:1fr}
    .city-list{grid-template-columns:1fr}
    h1{letter-spacing:-1.2px}
    .tagline{font-size:15px}
  }

.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}.explore-menu{position:relative}.explore-pill{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:13px;color:#475467;background:#fff;white-space:nowrap}.explore-dropdown{display:none;position:absolute;right:0;top:calc(100% + 8px);width:190px;padding:4px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,30,50,.14);z-index:50}.explore-dropdown.open{display:block}.explore-dropdown a{display:block;padding:10px 7px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text);font-size:13px;white-space:nowrap}.explore-dropdown a:last-child{border-bottom:0}.explore-dropdown a:hover,.explore-dropdown a:focus{background:var(--soft);color:var(--blue)}.lang-toggle{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.lang-toggle button{border:0;background:transparent;padding:8px 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}.lang-toggle button.active{background:var(--text);color:white}
@media(max-width:760px){.header-actions{gap:6px}.explore-pill{padding:8px 9px}.explore-dropdown{width:180px}.lang-toggle button{padding:7px 8px}.site-logo{width:175px;max-height:48px}}
@media(max-width:370px){.site-logo{width:150px}.explore-pill{gap:5px;padding:7px}.lang-toggle button{padding:6px 6px;font-size:12px}.explore-dropdown{right:-35px;width:170px}}

</style>

<body>
<div class="page">
<header>
  <div class="header-inner">

<script>
  const input = document.getElementById('citySearch');
  const allCitiesButton = document.getElementById('allCitiesButton');
  const allCitiesSection = document.getElementById('allCitiesSection');
  const allCityLinks = [...document.querySelectorAll('.city-link')];
  const count = document.getElementById('resultCount');

  allCitiesButton.addEventListener('click', () => {
    const isOpen = allCitiesSection.style.display !== 'none';
    allCitiesSection.style.display = isOpen ? 'none' : 'block';
    allCitiesButton.classList.toggle('active', !isOpen);
    if (!isOpen) {
      allCitiesSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  function filterCities(){
    const q = input.value.trim().toLowerCase();

    // Searching automatically opens the complete city list.
    if(q && allCitiesSection.style.display === 'none'){
      allCitiesSection.style.display = 'block';
      allCitiesButton.classList.add('active');
    }

    let visible = 0;
    allCityLinks.forEach(item => {
      const match = !q || item.dataset.search.toLowerCase().includes(q);
      item.style.display = match ? '' : 'none';
      if(match) visible++;
    });
    count.textContent = q ? `${visible} result${visible === 1 ? '' : 's'}` : '';
  }

  input.addEventListener('input', filterCities);
</script>
<script>
(function(){const buttons=[...document.querySelectorAll('[data-lang]')],translatable=[...document.querySelectorAll('[data-en][data-hi]')],menuButton=document.getElementById('exploreToggle'),menu=document.getElementById('exploreDropdown');function setLanguage(lang){document.documentElement.lang=lang;translatable.forEach(el=>{el.textContent=el.dataset[lang]});document.querySelectorAll('[data-en-placeholder][data-hi-placeholder]').forEach(el=>{el.placeholder=lang==='hi'?el.dataset.hiPlaceholder:el.dataset.enPlaceholder});buttons.forEach(btn=>{const active=btn.dataset.lang===lang;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});document.dispatchEvent(new CustomEvent('site-language-change',{detail:{lang}}))}buttons.forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));menuButton.addEventListener('click',()=>{const open=menu.classList.toggle('open');menuButton.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.explore-menu')){menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}});menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}))})();
</script>

function applyFallbackLanguage(lang){
 document.querySelectorAll('body *').forEach(el=>{
  if(el.children.length===0 && !el.closest('script,style,noscript,svg') && !el.hasAttribute('data-en') && !el.hasAttribute('data-hi')){
   if(!el.dataset.fallbackEnglish)el.dataset.fallbackEnglish=el.textContent;
   const en=el.dataset.fallbackEnglish.trim();
   if(translations[en]){const target=lang==='hi'?translations[en]:en;if(el.textContent!==target)el.textContent=target;}
  }
 });
 document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{
  if(!el.dataset.fallbackPlaceholder)el.dataset.fallbackPlaceholder=el.placeholder;
  const en=el.dataset.fallbackPlaceholder;
  if(translations[en]){const target=lang==='hi'?translations[en]:en;if(el.placeholder!==target)el.placeholder=target;}
 });
}
document.addEventListener('site-language-change',e=>applyFallbackLanguage(e.detail.lang));
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>applyFallbackLanguage(btn.dataset.lang)));
const observer=new MutationObserver(()=>{if(document.documentElement.lang==='hi')applyFallbackLanguage('hi')});
observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
<div id="google_translate_element" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden"></div>
<script>
(function(){
 function googleTranslateElementInit(){
  if(window.google&&google.translate&&google.translate.TranslateElement){
   new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'en,hi',autoDisplay:false},'google_translate_element');
  }
 }
 window.googleTranslateElementInit=googleTranslateElementInit;
 window.siteTranslateTo=function(lang){
  var attempts=0;
  var timer=setInterval(function(){
   var select=document.querySelector('.goog-te-combo');
   if(select){
    select.value=lang;
    select.dispatchEvent(new Event('change'));
    clearInterval(timer);
   } else if(++attempts>40){clearInterval(timer);console.warn('Translation service did not load.');}
  },250);
 };
 document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-lang]');
  if(!btn)return;
  var lang=btn.dataset.lang;
  if(lang==='hi'||lang==='en')window.siteTranslateTo(lang);
 });
})();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
